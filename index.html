<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tetris</title>
</head>
<body>
    <canvas id='board' style="border: 1px solid black;"></canvas>
    <script>
        const columns = 12
        const rows = 24
        // body margin (2 * 8px) + canvas border (2 * 1px)
        const gutter = 18
        let length, width, height
        function fitBoard() {
            length = Math.max(1, Math.floor(Math.min(
                (innerWidth - gutter) / columns,
                (innerHeight - gutter) / rows
            )))
            width = columns * length
            height = rows * length
            const board = document.getElementById('board')
            board.width = width
            board.height = height
        }
        fitBoard()
    </script>
    <script src="tetris.js"></script>
</body>
</html>
