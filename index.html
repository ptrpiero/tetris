<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tetris</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            box-sizing: border-box;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            padding: 8px;
        }
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 3.5em;
            font-size: 12px;
        }
        .stat b {
            font-size: 18px;
        }
        #next {
            width: 48px;
            height: 48px;
        }
        button {
            font: inherit;
            padding: 6px 12px;
            touch-action: manipulation;
        }
        #stage {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #frame {
            position: relative;
        }
        #board {
            display: block;
            border: 1px solid black;
            touch-action: none;
        }
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
        }
        #overlay[hidden] {
            display: none;
        }
        #overlay h2, #overlay p {
            margin: 0;
        }
        #controls {
            display: none;
            gap: 8px;
            padding: 8px;
        }
        #controls button {
            flex: 1;
            min-height: 56px;
            font-size: 24px;
        }
        @media (pointer: coarse) {
            #controls {
                display: flex;
            }
            #keys {
                display: none;
            }
        }
        @media (max-width: 480px) {
            #hud {
                gap: 4px 10px;
            }
            .stat {
                min-width: 2.5em;
            }
            #hud button {
                padding: 6px 8px;
                font-size: 14px;
            }
        }
        #keys {
            margin: 0;
            padding: 0 8px 8px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <header id="hud">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Lines</span><b id="lines">0</b></div>
        <div class="stat"><span>Level</span><b id="level">1</b></div>
        <div class="stat"><span>Next</span><canvas id="next" width="48" height="48"></canvas></div>
        <button id="pause" data-command="pause">Pause</button>
        <button data-command="restart">Restart</button>
    </header>
    <main id="stage">
        <div id="frame">
            <canvas id="board"></canvas>
            <div id="overlay" hidden>
                <h2></h2>
                <p></p>
                <button></button>
            </div>
        </div>
    </main>
    <nav id="controls">
        <button data-control="left" aria-label="Move left">◀</button>
        <button data-control="right" aria-label="Move right">▶</button>
        <button data-control="softDrop" aria-label="Soft drop">▼</button>
        <button data-control="hardDrop" aria-label="Hard drop">⤓</button>
        <button data-control="rotate" aria-label="Rotate">⟳</button>
    </nav>
    <p id="keys">← → move · ↑ rotate · ↓ soft drop · Space hard drop · P pause · Enter start</p>
    <script src="tetris.js"></script>
</body>
</html>
